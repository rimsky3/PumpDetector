# Сервер (Vultr, Франкфурт, 2 vCPU / 4 ГБ RAM, з 2026-10-06): база + скринер 24/7 + дашборд + записувач ліквідацій.
# На сервері, з папки ~/pd:
#   docker compose -f docker-compose.server.yml up -d --build     — зібрати образ і запустити все
#   docker compose -f docker-compose.server.yml logs -f screener  — лог скринера наживо
#   docker compose -f docker-compose.server.yml restart screener  — після оновлення коду чи моделі
# Секрети — у ~/pd/.env (лише COINALYZE_API_KEY і POSTGRES_PASSWORD). Опис — docs/server.md.
# Локальна база на ноутбуці — як і раніше, docker-compose.yml.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заповни POSTGRES_PASSWORD у .env}
      POSTGRES_DB: pump_detector
    # пам'ять бази під 4-ГБ сервер: кеш сторінок 512 МБ, решту віддаємо скринеру й дашборду;
    # без паралельних запитів: на 2 ядрах кожен запит у 3 процеси лише множив конкуренцію (07.10: load 20, запити в черзі)
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=32MB
               -c maintenance_work_mem=256MB -c max_connections=60 -c max_parallel_workers_per_gather=0
    # порт 5432 НЕ відкриваємо: до бази ходять лише контейнери цієї мережі (за ім'ям db)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pump_detector"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1200m

  screener:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python screener.py --loop
    working_dir: /app
    volumes:
      - ./:/app                     # код, models/, reports/, списки тікерів — з папки на сервері
    environment:
      # має пріоритет над .env (load_dotenv не перезаписує наявні змінні): база — контейнер db
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pump_detector
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1500m

  dashboard:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python dashboard.py --host 0.0.0.0 --no-browser
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pump_detector
      JOURNAL_WARMER: "1"           # журнал у фоні — лише 2 год після останнього звернення до нього (dashboard.JOURNAL_KEEP_WARM); "0" — ніколи
    # лише 127.0.0.1 сервера: з інтернету не видно, доступ — SSH-тунелем
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1200m

  # ліквідації з бірж через WebSocket → liq_events (liq_recorder.py); легкий, ~50–100 МБ
  liqrec:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python liq_recorder.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pump_detector
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 250m

  # угоди Binance + Bybit (WebSocket) → 5-хв зведення з футпрінтом trade_bars; з нього скринер шукає мітки b / p
  # (footprint.py); історію (бектести) дають архіви бірж; docs/trades.md
  traderec:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python trade_recorder.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pump_detector
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 300m

  # активні TWAP Hyperliquid по всьому ринку (потік угод → адреси з порціями кожні 30 с → twapHistory), лише в пам'яті;
  # дашборд питає http://hltwap:8790/twaps (порт лише всередині мережі compose); hl_twap.py; ~2–4% ядра
  # позиції власника Binance Futures наживо (my_positions.py): конус від входу в дашборді + запис виконань у my_fills;
  # ключ ЛИШЕ ЧИТАННЯ — BINANCE_API_KEY / BINANCE_API_SECRET у ~/pd/.env (не в git); одне WebSocket-з'єднання
  myacct:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python my_positions.py --loop
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pump_detector
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 150m

  hltwap:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python hl_twap.py
    working_dir: /app
    volumes:
      - ./:/app
    mem_limit: 200m

  # HTTPS + логін/пароль перед дашбордом: https://<PD_HOST> з будь-якого пристрою (Caddyfile; значення — у .env)
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PD_HOST: ${PD_HOST:?заповни PD_HOST у .env}
      PD_USER: ${PD_USER:?заповни PD_USER у .env}
      PD_PASS_HASH: ${PD_PASS_HASH:?заповни PD_PASS_HASH у .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # сертифікати — переживають перезапуск
      - caddy_config:/config
    depends_on:
      - dashboard
    mem_limit: 150m

  # Telegram-бот: сповіщення про сигнали і результати журналу кнопками (tg_bot.py); дані бере в дашборда всередині
  # Docker-мережі, токен — TELEGRAM_BOT_TOKEN у .env. Запуск: docker compose -f docker-compose.server.yml up -d tgbot
  tgbot:
    build: .
    image: pump-detector
    restart: unless-stopped
    command: python tg_bot.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DASH_URL: http://dashboard:8766
      PUBLIC_URL: https://${PD_HOST}
    depends_on:
      - dashboard
    mem_limit: 200m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
